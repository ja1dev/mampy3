name: Build Portable Python Environment

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Download Miniforge3
        run: |
          Invoke-WebRequest -Uri "https://github.com/conda-forge/miniforge/releases/latest/download/Miniforge3-Windows-x86_64.exe" -OutFile "miniforge.exe"

      - name: Install Miniforge3 (portable)
        run: |
          $installPath = "$env:GITHUB_WORKSPACE\miniforge3"
          Start-Process -FilePath ".\miniforge.exe" -ArgumentList "/S", "/D=$installPath" -Wait -NoNewWindow
          Write-Host "Installed to: $installPath"
          Get-ChildItem $installPath -ErrorAction SilentlyContinue | Select-Object -First 10

      - name: Verify installation
        run: |
          $mambaPath = "$env:GITHUB_WORKSPACE\miniforge3\Scripts\mamba.exe"
          if (Test-Path $mambaPath) {
            Write-Host "mamba.exe found at: $mambaPath"
          } else {
            Write-Host "mamba.exe NOT found, checking alternative locations..."
            Get-ChildItem "$env:GITHUB_WORKSPACE" -Recurse -Filter "mamba.exe" -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_.FullName }
            Get-ChildItem "$env:USERPROFILE" -Recurse -Filter "mamba.exe" -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_.FullName }
          }

      - name: Install Python 3.11 via Mamba
        run: |
          $env:PATH = "$env:GITHUB_WORKSPACE\miniforge3;$env:GITHUB_WORKSPACE\miniforge3\Scripts;$env:GITHUB_WORKSPACE\miniforge3\Library\bin;$env:PATH"
          mamba install -n base python=3.11 -y
          mamba clean --all -y

      - name: Create activation script
        shell: powershell
        run: |
          $content = @"
@echo off
set CONDA_PREFIX=%~dp0miniforge3
set PATH=%CONDA_PREFIX%;%CONDA_PREFIX%\Scripts;%CONDA_PREFIX%\Library\bin;%PATH%
echo.
echo Miniforge3 environment activated!
echo Python: %CONDA_PREFIX%\python.exe
echo Mamba: %CONDA_PREFIX%\Scripts\mamba.exe
echo.
cmd /k
"@
          $content | Out-File -FilePath "activate.bat" -Encoding ascii -NoNewline

      - name: Zip environment
        run: |
          Compress-Archive -Path "miniforge3", "activate.bat" -DestinationPath "mampy3-portable.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mampy3-portable
          path: mampy3-portable.zip
          retention-days: 30
