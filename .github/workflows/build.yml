name: Build Portable Python Environment

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Download Miniforge3
        run: Invoke-WebRequest -Uri "https://github.com/conda-forge/miniforge/releases/latest/download/Miniforge3-Windows-x86_64.exe" -OutFile "C:\miniforge.exe"

      - name: Install Miniforge3
        shell: cmd
        run: C:\miniforge.exe /S /D=C:\miniforge3

      - name: Wait for installation
        run: Start-Sleep -Seconds 30

      - name: Verify installation
        run: |
          Get-ChildItem "C:\miniforge3" -ErrorAction SilentlyContinue
          Get-ChildItem "C:\miniforge3\Scripts" -ErrorAction SilentlyContinue

      - name: Install mamba and Python 3.11
        shell: cmd
        run: |
          call C:\miniforge3\Scripts\activate.bat
          conda install -n base mamba python=3.11 -y
          conda clean --all -y

      - name: Verify mamba
        shell: cmd
        run: |
          call C:\miniforge3\Scripts\activate.bat
          where mamba
          mamba --version

      - name: Create activation script
        shell: cmd
        run: |
          echo @echo off > C:\activate.bat
          echo set CONDA_PREFIX=%%~dp0miniforge3 >> C:\activate.bat
          echo set PATH=%%CONDA_PREFIX%%;%%CONDA_PREFIX%%\Scripts;%%CONDA_PREFIX%%\Library\bin;%%PATH%% >> C:\activate.bat
          echo echo Miniforge3 activated >> C:\activate.bat
          echo cmd /k >> C:\activate.bat

      - name: Zip environment
        run: Compress-Archive -Path "C:\miniforge3", "C:\activate.bat" -DestinationPath "C:\mampy3-portable.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mampy3-portable
          path: C:\mampy3-portable.zip
          retention-days: 30
